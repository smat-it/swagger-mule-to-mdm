openapi: 3.0.3

# =============================================================================
# ATTENZIONE - Specifica RICOSTRUITA
# -----------------------------------------------------------------------------
# Non e' il RAML/OAS originale: e' ricostruita dai flussi APIkit e dai
# Transform Message DataWeave dell'implementazione Mule.
# Ogni POST include un ESEMPIO di body (campo "example").
#
# Legenda affidabilita' dei payload:
#   [DERIVATO]     -> campi ricavati direttamente dal codice (payload.X usati)
#   [COSTRUITO]    -> struttura costruita in un Transform Message del flusso
#   [ILLUSTRATIVO] -> non ricavabile dal codice, esempio plausibile da validare
# =============================================================================

info:
  title: sys-mdm API 
  description: 
  version: 1.0.0

servers:
  - url: http://localhost:8081/api
    description: 

tags:
  - name: Health
  - name: Assets
  - name: Readings
  - name: Consumption Profiles
  - name: Contracts
  - name: Meter Profiles
  - name: Cases

paths:

  # ---------------------------------------------------------------------------
  # HEALTH (nessun body)
  # ---------------------------------------------------------------------------
  /sys-mdm/health:
    get:
      tags: [Health]
      summary: Health check
      operationId: getHealth
      responses:
        '200':
          description: Applicazione attiva

  /sys-mdm/metrics:
    get:
      tags: [Health]
      summary: Metriche applicative
      operationId: getMetrics
      responses:
        '200':
          description: Metriche restituite

  /sys-mdm/metrics/prometheus:
    get:
      tags: [Health]
      summary: Metriche formato Prometheus
      operationId: getMetricsPrometheus
      responses:
        '200':
          description: Metriche Prometheus restituite

  /sys-mdm/stats:
    get:
      tags: [Health]
      summary: Statistiche applicative
      operationId: getStats
      responses:
        '200':
          description: Statistiche restituite

  # ---------------------------------------------------------------------------
  # ASSETS
  # ---------------------------------------------------------------------------
  /sys-mdm/assets/is-asset-remote-read:
    get:
      tags: [Assets]
      summary:
      operationId: isAssetRemoteRead
      parameters:
        - name: Contract
          in: query
          required: true
          schema: { type: string }
        - name: AssetSerial
          in: query
          required: false
          schema: { type: string }
        - name: Pdp
          in: query
          required: false
          schema: { type: string }
      responses:
        '200':
          description: Esito della verifica
          content:
            application/json:
              schema: { type: object }
        default:
          $ref: '#/components/responses/ErrorResponse'

  /sys-mdm/assets/asset:
    post:
      tags: [Assets]
      summary:
      description:
      operationId: postAsset
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssetPayload'
            example:
              AppKey: "A1B2C3D4"
              Brand: "Sensus"
              Class: "C"
              Company: "EXT-COMP-001"
              DigitsNumber: 6
              Id: "ASSET-000123"
              Length: 190
              MetrologicalClass: "R160"
              Model: "iPERL"
              Protocol: "wM-Bus"
              Q3FlowRate: 2.5
              SerialNumber: "SN-998877"
              Service: "Acqua"
              Status: "Installed"
              Technology: "Static"
              Year: 2024
      responses:
        '200':
          description:
          content:
            application/json:
              schema: { type: object }
        default:
          $ref: '#/components/responses/ErrorResponse'

  # ---------------------------------------------------------------------------
  # READINGS
  # ---------------------------------------------------------------------------
  /sys-mdm/readings/reading:
    get:
      tags: [Readings]
      summary: Recupera una lettura
      operationId: getReading
      parameters:
        - name: Contract
          in: query
          required: true
          schema: { type: string }
        - name: Date
          in: query
          required: false
          schema: { type: string, format: date }
        - name: Pdp
          in: query
          required: false
          schema: { type: string }
      responses:
        '200':
          description: Lettura restituita
          content:
            application/json:
              schema: { type: object }
        default:
          $ref: '#/components/responses/ErrorResponse'
    post:
      tags: [Readings]
      summary:
      description:
      operationId: postReading
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReadingPayload'
            example:
              Consuming:
                Date: "2025-06-01"
                ReadingType: "Reale"
                Status: "Validata"
                Value: 1234.56
                WaterDamage: false
              Contract:
                Id: "CT-000123"
              Customer:
                Id: "1000456"
              Meter:
                Id: "SN-998877"
              PDP:
                Id: "PDP-45678"
      responses:
        '200':
          description: Lettura inviata con successo
          content:
            application/json:
              schema: { type: object }
        default:
          $ref: '#/components/responses/ErrorResponse'

  /sys-mdm/readings/reading-validation:
    get:
      tags: [Readings]
      summary: Valida una lettura
      operationId: getReadingValidation
      parameters:
        - name: ContractNumber
          in: query
          required: true
          schema: { type: string }
        - name: ReadingDate
          in: query
          required: true
          schema: { type: string, format: date }
        - name: ReadingValue
          in: query
          required: true
          schema: { type: number }
      responses:
        '200':
          description: Esito della validazione
          content:
            application/json:
              schema: { type: object }
        default:
          $ref: '#/components/responses/ErrorResponse'

  /sys-mdm/readings/reading-snapshot:
    get:
      tags: [Readings]
      summary: Snapshot di una lettura
      operationId: getReadingSnapshot
      parameters:
        - name: Contract
          in: query
          required: true
          schema: { type: string }
        - name: Date
          in: query
          required: false
          schema: { type: string, format: date }
        - name: Pdp
          in: query
          required: false
          schema: { type: string }
      responses:
        '200':
          description: Snapshot restituito
          content:
            application/json:
              schema: { type: object }
        default:
          $ref: '#/components/responses/ErrorResponse'

  /sys-mdm/readings/readings-by-dates-and-contracts:
    post:
      tags: [Readings]
      summary:
      description: 
      operationId: postReadingsByDatesAndContracts
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReadingsByDatesAndContractsRequest'
            example:
              contracts:
                - "CT-000123"
                - "CT-000124"
              startDate: "2025-01-01"
              endDate: "2025-01-31"
      responses:
        '200':
          description: Letture restituite
          content:
            application/json:
              schema: { type: object }
        default:
          $ref: '#/components/responses/ErrorResponse'

  # ---------------------------------------------------------------------------
  # CONSUMPTION PROFILES
  # ---------------------------------------------------------------------------
  /sys-mdm/consumptionProfiles/consumption-profile:
    get:
      tags: [Consumption Profiles]
      summary:
      operationId: getConsumptionProfile
      parameters:
        - name: Contract
          in: query
          required: true
          schema: { type: string }
        - name: Date
          in: query
          required: true
          schema: { type: string, format: date }
      responses:
        '200':
          description: Profilo di consumo restituito
          content:
            application/json:
              schema: { type: object }
        default:
          $ref: '#/components/responses/ErrorResponse'

  # ---------------------------------------------------------------------------
  # CASES
  # ---------------------------------------------------------------------------
  /case:
    get:
      tags: [Cases]
      summary: Ricerca case su Salesforce
      operationId: getCases
      parameters:
        - name: Asset
          in: query
          required: false
          schema: { type: string }
        - name: PDPCode
          in: query
          required: false
          schema: { type: string }
        - name: ContractCode
          in: query
          required: false
          schema: { type: string }
      responses:
        '200':
          description: Elenco dei case trovati
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CaseSummary'
        default:
          $ref: '#/components/responses/ErrorResponse'
    post:
      tags: [Cases]
      summary:
      description:
      operationId: createCase
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCaseRequest'
            example:
              ContractName: "CT-000123"
              PdpCode: "PDP-45678"
              AssetSerialNumber: "SN-998877"
              CustomerCode: "1000456"
              RecordType: "ConsumptionAnomaly"
              Subject: "Anomalia di consumo rilevata"
              Description: "Consumo anomalo registrato sul misuratore SN-998877"
              CaseOrigin: "MDM"
              Priority: "Alta"
      responses:
        '200':
          description: Case creato
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaseCreated'
              example:
                Id: "5001x000ABCDEmQAF"
                CaseNumber: "00123456"
        default:
          $ref: '#/components/responses/ErrorResponse'

  # ---------------------------------------------------------------------------
  # CONTRACTS
  # ---------------------------------------------------------------------------
  /contract:
    post:
      tags: [Contracts]
      summary:
      description:
      operationId: createContract
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContractRequest'
            example:
              Id: "CT-000123"
              ContractName: "CT-000123"
              ExtId: "EXT-CT-000123"
              RefCode: "REF-778899"
              StartDate: "2025-01-01"
              EndDate: "2027-12-31"
              SigningDate: "2024-12-15"
              Stage: "Active"
              SupplyType: "Acqua"
              TransferType: "Voltura"
              ActivationReason: "Nuova attivazione"
              EndReason: null
              MorosityType: "Nessuna"
              SupplyNotUsed: "false"
              DivisionalCounters: false
              BillingFrequencyCode: "BIM"
              WarningReadingCounter: ""
              PhoneReadingCounter: "0110000000"
              TelephoneReadingCounter: "0110000001"
              EmailReadingCounter: "letture@example.com"
              ParentId: null
              Company: "001"
              BillingProfiles:
                - Id: "a1B0X0000000001"
                  Name: "BP-0001"
                  StartDate: "2025-01-01"
                  EndDate: "2025-12-31"
                  Company: "001"
              Customer:
                RecordType: "PersonAccount"
                Id: "1000456"
                Name: "Mario Rossi"
                Email: "mario.rossi@example.com"
                Phone: "3330000000"
                Pec: "mario.rossi@pec.example.com"
                PublicEntity: false
                Company: "001"
                Address:
                  Street: "Via Roma 1"
                  Country: "IT"
                  City: "Torino"
                  State: "TO"
                  PostalCode: "10121"
                  Locality: "Torino"
                  EgonCode: "EGON-CUST-789"
                  IstatCode: "001272"
                  Latitude: "45.0703"
                  Longitude: "7.6869"
              PDP:
                Id: "PDP-45678"
                Name: "PDP-45678"
                Role: "Titolare"
                Status: "Attivo"
                Service: "Acqua"
                Accessibility: "Libero"
                ConditionType: "Standard"
                ReadingUnit: "mc"
                FlowClass: "C"
                Code: "45678"
                Code2: "12345"
                Code3: "67890"
                DateFrom: "2025-01-01"
                DateTo: null
                ModificationDate: "2025-01-10T09:30:00"
                Company: "001"
                Tank:
                  Id: "TANK-001"
                  Name: "Serbatoio Nord"
                  Service: "Acqua"
                  IsActive: true
                  Company: "001"
                Address:
                  Street: "Via Milano 5"
                  Country: "IT"
                  City: "Torino"
                  State: "Torino"
                  PostalCode: "10122"
                  Locality: "Torino"
                  EgonCode: "EGON-PDP-321"
                  IstatCode: "001272"
                  Latitude: "45.0710"
                  Longitude: "7.6850"
                Meters:
                  - Id: "a2C0X0000000001"
                    Status: "Installato"
                    OpeningDate: "2025-01-02"
                    OpeningValue: 0
                    ClosingDate: null
                    ClosingValue: null
                    DateRemoved: null
                    PoseDate: "2025-01-02"
                    ReadAccessibility: "Diretta"
                    PhysicalAccessibilityMeter: "Facile"
                    RemotelyManaged: false
                    NotesMeterLocation: "Contatore in nicchia esterna"
                    Company: "001"
                    Asset:
                      SerialNumber: "SN-998877"
                      SerialNumberRadio: "RAD-112233"
                      SerialNumberRadio2: "RAD-445566"
                      Description: "Contatore acqua DN20"
                      Brand: "Sensus"
                      Model: "iPERL"
                      Class: "C"
                      MetrologicalClass: "R160"
                      Technology: "Static"
                      Protocol: "wM-Bus"
                      Status: "Installed"
                      Service: "Acqua"
                      Q3FlowRate: 2.5
                      MaxFlowRate: 3.125
                      MinFlowRate: 0.016
                      Length: 190
                      DigitsNumber: 6
                      Year: 2024
                      AppKey: "A1B2C3D4"
                      Company: "EXT-COMP-001"
                ContractLine:
                  - Id: "8010X0000000001"
                    StartDate: "2025-01-01"
                    EndDate: "2027-12-31"
                    TICSIUsage: "Domestico residente"
                    MacroTICSI: "Domestico"
                    Ato: "ATO3"
                    SupplyContractInsuranceWaterLossCode: "SMAT-0001"
                    AgreedVolumeMc: 200
                    ConcessionNumber: null
                    Aqueduct: true
                    CommercialActivity: null
                    NoSecurityDeposit: false
                    SewerageContribution: true
                    PurificationContribution: true
                    HomeComponent: 1
                    ResidentCondominiumComponent: 0
                    DomesticUnit: 1
                    NonResidentCondominiumComponent: 0
                    NonDomesticUnit: 0
                    NonDomesticComponent: 0
                    ReferenceYear180: false
                    ReferenceYear400: false
                    PriceBookExtId: "PB-ENTRY-001"
      responses:
        '200':
          description: Contratto elaborato
          content:
            application/json:
              schema: { type: object }
        default:
          $ref: '#/components/responses/ErrorResponse'

  # ---------------------------------------------------------------------------
  # METER PROFILES
  # ---------------------------------------------------------------------------
  /meterProfile:
    post:
      tags: [Meter Profiles]
      summary:
      description:
      operationId: upsertMeterProfile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MeterProfileRequest'
            example:
              ContractCode: "CT-000123"
              PDPCode: "PDP-45678"
              Frequency: "Mensile"
              StartDate: "2025-01-01"
              EndDate: "2025-12-31"
              Status: "Attivo"
              AnnualValue: 1200.5
      responses:
        '200':
          description: MeterProfile creato o aggiornato
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeterProfileResponse'
              example:
                Id: "a0X1x000000ABCDEAA"
                MeterProfile_Name: "MP-000123"
                result: true
        default:
          $ref: '#/components/responses/ErrorResponse'

# =============================================================================
# COMPONENTS
# =============================================================================
components:

  responses:
    ErrorResponse:
      description: Errore restituito dall'API (formato standard APIkit/handler)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            message: "Service contract not found"
            type: "NOT_FOUND"
            result: false

  schemas:

    Error:
      type: object
      properties:
        message: { type: string }
        type: { type: string }
        result: { type: boolean, example: false }

    CreateCaseRequest:
      type: object
      required: [ContractName, AssetSerialNumber, CustomerCode, RecordType]
      properties:
        ContractName: { type: string, example: "CT-000123" }
        PdpCode: { type: string, example: "PDP-45678" }
        AssetSerialNumber: { type: string, example: "SN-998877" }
        CustomerCode: { type: string, example: "1000456" }
        RecordType:
          type: string
          example: "ConsumptionAnomaly"
          description: >-
            DeveloperName del RecordType. Valori attesi (dal filtro nel GET):
            ReplacementMeter, VerificationReadingCounter, ConsumptionAnomaly,
            VerificaMetrologica, VerificaPressioneMisuratore.
        Subject: { type: string, example: "Anomalia di consumo rilevata" }
        Description: { type: string, example: "Consumo anomalo registrato" }
        CaseOrigin: { type: string, example: "MDM" }
        Priority: { type: string, example: "Alta" }

    CaseCreated:
      type: object
      properties:
        Id: { type: string, example: "5001x000ABCDEmQAF" }
        CaseNumber: { type: string, example: "00123456" }

    SalesforceCaseRecord:
      type: object
      description: >-
        [INTERNO - NON e' il request body] Record Case costruito dal flusso POST /case e
        inviato a salesforce:create, dopo aver risolto gli input in Id Salesforce.
        Documentato solo a scopo di mappatura: il chiamante non invia questi campi.
      properties:
        ServiceContractId:
          type: string
          description: "Id risolto da ServiceContract WHERE Name = ContractName"
        AccountId:
          type: string
          description: "Id risolto da Account WHERE Code__c = CustomerCode"
        AssetId:
          type: string
          description: "Id risolto da Asset WHERE SerialNumber = AssetSerialNumber"
        RecordTypeId:
          type: string
          description: "Id risolto da RecordType WHERE DeveloperName = RecordType"
        PDP__c:
          type: string
          nullable: true
          description: "Id risolto da PDP WHERE Name = PdpCode (aggiunto solo se PdpCode presente)"
        Subject:
          type: string
          description: "= payload.Subject"
        Description:
          type: string
          description: "= payload.Description"
        Origin:
          type: string
          description: "= payload.CaseOrigin"
        Priority:
          type: string
          description: "= payload.Priority"
        Status:
          type: string
          description: "Valore fisso impostato dal flusso"
          example: "Nuovo"
      example:
        ServiceContractId: "8000X000000AAAAQA4"
        AccountId: "0010X000004BBBBQAW"
        AssetId: "02i0X000008CCCCQAW"
        RecordTypeId: "0120X000000DDDDQAG"
        PDP__c: "a050X000009EEEEQAW"
        Subject: "Anomalia di consumo rilevata"
        Description: "Consumo anomalo registrato sul misuratore SN-998877"
        Origin: "MDM"
        Priority: "Alta"
        Status: "Nuovo"

    CaseSummary:
      type: object
      properties:
        PdpCode: { type: string }
        CustomerCode: { type: string }
        AssetSerialNumber: { type: string }
        ContractName: { type: string }
        RecordType: { type: string }
        Subject: { type: string }
        Description: { type: string }
        Status: { type: string }
        CaseOrigin: { type: string }
        Priority: { type: string }

    MeterProfileRequest:
      type: object
      required: [ContractCode, PDPCode, Frequency, StartDate, Status, AnnualValue]
      properties:
        ContractCode: { type: string, example: "CT-000123" }
        PDPCode: { type: string, example: "PDP-45678" }
        Frequency: { type: string, example: "Mensile" }
        StartDate: { type: string, format: date, example: "2025-01-01" }
        EndDate: { type: string, format: date, example: "2025-12-31" }
        Status: { type: string, example: "Attivo" }
        AnnualValue: { type: number, example: 1200.5 }

    MeterProfileResponse:
      type: object
      properties:
        Id: { type: string, example: "a0X1x000000ABCDEAA" }
        MeterProfile_Name: { type: string, example: "MP-000123" }
        result: { type: boolean, example: true }

    ReadingPayload:
      type: object
      properties:
        Consuming:
          type: object
          properties:
            Date: { type: string, format: date, example: "2025-06-01" }
            ReadingType: { type: string, example: "Reale" }
            Status: { type: string, example: "Validata" }
            Value: { type: number, example: 1234.56 }
            WaterDamage: { type: boolean, default: false, example: false }
        Contract:
          type: object
          properties:
            Id: { type: string, example: "CT-000123" }
        Customer:
          type: object
          properties:
            Id: { type: string, example: "1000456" }
        Meter:
          type: object
          properties:
            Id: { type: string, example: "SN-998877" }
        PDP:
          type: object
          properties:
            Id: { type: string, example: "PDP-45678" }

    AssetPayload:
      type: object
      properties:
        AppKey: { type: string, example: "A1B2C3D4" }
        Brand: { type: string, example: "Sensus" }
        Class: { type: string, example: "C" }
        Company: { type: string, example: "EXT-COMP-001" }
        DigitsNumber: { type: integer, example: 6 }
        Id: { type: string, example: "ASSET-000123" }
        Length: { type: number, example: 190 }
        MetrologicalClass: { type: string, example: "R160" }
        Model: { type: string, example: "iPERL" }
        Protocol: { type: string, example: "wM-Bus" }
        Q3FlowRate: { type: number, example: 2.5 }
        SerialNumber: { type: string, example: "SN-998877" }
        Service: { type: string, example: "Acqua" }
        Status: { type: string, example: "Installed" }
        Technology: { type: string, example: "Static" }
        Year: { type: integer, example: 2024 }

    ReadingsByDatesAndContractsRequest:
      type: object
      description: '[ILLUSTRATIVO] Struttura non ricavabile dal codice (pass-through).'
      properties:
        contracts:
          type: array
          items: { type: string }
          example: ["CT-000123", "CT-000124"]
        startDate: { type: string, format: date, example: "2025-01-01" }
        endDate: { type: string, format: date, example: "2025-01-31" }

    ContractRequest:
      type: object
      description: >-
        [DERIVATO da MDM_contract.dwl] Contratto inviato al backend MDM,
        assemblato da Salesforce + stradario Egon.
      properties:
        Id: { type: string, description: "ServiceContract.Name" }
        ContractName: { type: string, description: "ServiceContract.Name" }
        ExtId: { type: string }
        RefCode: { type: string }
        StartDate: { type: string, format: date }
        EndDate: { type: string, format: date }
        SigningDate: { type: string, format: date }
        Stage: { type: string }
        SupplyType: { type: string }
        TransferType: { type: string }
        ActivationReason: { type: string }
        EndReason: { type: string, nullable: true }
        MorosityType: { type: string }
        SupplyNotUsed: { type: string }
        DivisionalCounters: { type: boolean, default: false }
        BillingFrequencyCode: { type: string }
        WarningReadingCounter: { type: string, default: "" }
        PhoneReadingCounter: { type: string }
        TelephoneReadingCounter: { type: string }
        EmailReadingCounter: { type: string }
        ParentId: { type: string, nullable: true, description: "ParentServiceContractId" }
        Company: { type: string }
        BillingProfiles:
          type: array
          items:
            $ref: '#/components/schemas/BillingProfile'
        Customer:
          $ref: '#/components/schemas/ContractCustomer'
        PDP:
          $ref: '#/components/schemas/ContractPDP'

    BillingProfile:
      type: object
      properties:
        Id: { type: string }
        Name: { type: string }
        StartDate: { type: string, format: date }
        EndDate: { type: string, format: date }
        Company: { type: string }

    ContractAddress:
      type: object
      description: "Indirizzo arricchito con lo stradario Egon (campi DSXOBJ*, CDXZIP)."
      properties:
        Street: { type: string, description: "Egon DSXOBJSTR" }
        Country: { type: string, default: "IT" }
        City: { type: string, description: "Egon DSXOBJCNL" }
        State: { type: string }
        PostalCode: { type: string, description: "Egon CDXZIP" }
        Locality: { type: string, description: "Egon DSXOBJCNL" }
        EgonCode: { type: string }
        IstatCode: { type: string }
        Latitude: { type: string, nullable: true }
        Longitude: { type: string, nullable: true }

    ContractCustomer:
      type: object
      description: "Account Salesforce (con logica IsPersonAccount)."
      properties:
        RecordType: { type: string, description: "RecordTypeName" }
        Id: { type: string, description: "Account.Code__c" }
        Name: { type: string }
        Email: { type: string }
        Phone: { type: string }
        Pec: { type: string }
        PublicEntity: { type: boolean, default: false }
        Company: { type: string }
        Address:
