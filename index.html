<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <title>sys-mdm API — Documentazione</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <!-- Swagger UI CSS (da CDN) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swagger-ui-dist@5/swagger-ui.css" />
  <style>
    body { margin: 0; background: #fff; }
  </style>
</head>
<body>
  <div id="swagger-ui"></div>

  <!-- Swagger UI JS (da CDN) -->
  <script src="https://cdn.jsdelivr.net/npm/swagger-ui-dist@5/swagger-ui-bundle.js" crossorigin></script>
  <script src="https://cdn.jsdelivr.net/npm/swagger-ui-dist@5/swagger-ui-standalone-preset.js" crossorigin></script>
  <script>
    window.onload = function () {
      window.ui = SwaggerUIBundle({
        // URL raw del tuo file YAML su GitHub
        url: "https://raw.githubusercontent.com/smat-it/swagger-mule-to-mdm/main/desing-sys-mdm-with-examples.yaml",
        dom_id: "#swagger-ui",
        deepLinking: true,
        presets: [
          SwaggerUIBundle.presets.apis,
          SwaggerUIStandalonePreset
        ],
        layout: "StandaloneLayout"
      });
    };
  </script>
</body>
</html>
